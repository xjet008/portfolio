<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101311" />
  <title>jet.js | terminal portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <header class="chrome">
    <div class="window-controls" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="window-title">jet@portfolio:~</div>
    <nav class="tabs" aria-label="Terminal sections">
      <a class="tab on" href="#whoami">whoami</a>
      <a class="tab" href="#story">story.md</a>
      <a class="tab" href="#school">school.md</a>
    </nav>
    <button type="button" id="theme" aria-label="Toggle light theme">◐</button>
  </header>
  <div class="page">
    <aside class="gutter" id="gutter" aria-hidden="true"></aside>
    <main class="main">
      <section class="hero">
        <p class="eyebrow">interactive profile / v1.0.26</p>
        <h1>jet<span class="cursor-block">_</span></h1>
        <p class="intro">A terminal that keeps executing as you scroll.<br />No dashboard. No noise. Just the story.</p>
        <p class="scroll-hint"><span>↓</span> scroll to execute</p>
      </section>
      <section class="terminal-shell" aria-label="Jet portfolio terminal">
        <div class="terminal-bar"><span>bash</span><span id="progress">0%</span></div>
        <div id="terminal" class="terminal" tabindex="0" aria-live="polite"></div>
        <div class="terminal-end"><span class="prompt-mark">jet@portfolio:~$</span><span class="blink">█</span></div>
      </section>
      <footer class="footer">
        <span>EOF // curiosity is the engine</span>
        <div class="links"><a href="https://x.com/xjet008" target="_blank" rel="noopener">x.com</a><a href="https://github.com/xjet008" target="_blank" rel="noopener">github</a><a href="https://app.ethos.network/profile/x/xjet008" target="_blank" rel="noopener">ethos</a></div>
      </footer>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
